<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test API · Deployment Check</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      color: #eef5ff; background: radial-gradient(circle at top, #173b5f, #07111f 58%);
    }
    main {
      width: min(720px, calc(100% - 32px)); padding: 48px; border: 1px solid #31506b;
      border-radius: 24px; background: rgba(8, 23, 39, .82); box-shadow: 0 24px 80px #0008;
    }
    .status { display: inline-flex; gap: 10px; align-items: center; color: #74f1ad; font-weight: 700; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #47e58e; box-shadow: 0 0 18px #47e58e; }
    h1 { margin: 20px 0 10px; font-size: clamp(34px, 7vw, 62px); letter-spacing: -.04em; }
    p { color: #b9c9d8; font-size: 18px; line-height: 1.7; }
    ol { margin: 30px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
    li { padding: 14px 16px; border-radius: 12px; background: #10283e; color: #d8e8f7; }
    code { color: #72d8ff; }
    footer { margin-top: 30px; color: #71869a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>DEPLOYMENT ONLINE</div>
    <h1>部署链路已联通</h1>
    <p>这个页面由 GitHub Actions 构建为 ARM64 Docker 镜像，服务器从 GHCR 拉取镜像，并通过 Nginx 提供访问。</p>
    <ol>
      <li>① GitHub Actions · 镜像构建成功</li>
      <li>② GHCR · 镜像发布成功</li>
      <li>③ Docker · 容器运行成功</li>
      <li>④ Nginx · 反向代理成功</li>
    </ol>
    <footer>test-api · <code>/health</code> 可用于自动健康检查</footer>
  </main>
</body>
</html>
